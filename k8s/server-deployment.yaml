apiVersion: apps/v1
kind: Deployment
metadata:
  name: mechanic-server
  namespace: mechanic
  labels:
    app: mechanic-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mechanic-server
  template:
    metadata:
      labels:
        app: mechanic-server
    spec:
      containers:
        - name: server
          image: mechanic-server:latest
          # Never pull from a registry — use the locally-built image
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: server-config
            - secretRef:
                name: mechanic-secrets
          volumeMounts:
            - name: db-storage
              mountPath: /app/db
            - name: photos-storage
              mountPath: /app/photos
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: db-pvc
        - name: photos-storage
          persistentVolumeClaim:
            claimName: photos-pvc
