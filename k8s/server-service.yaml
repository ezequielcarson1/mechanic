apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: mechanic
spec:
  selector:
    app: mechanic-server
  ports:
    - name: http
      protocol: TCP
      port: 3000         # ClusterIP port (used by nginx proxy inside the cluster)
      targetPort: 3000
      nodePort: 30000    # Accessible on localhost:30000 (mobile app / dev tools)
  type: NodePort
