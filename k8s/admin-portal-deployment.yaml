apiVersion: apps/v1
kind: Deployment
metadata:
  name: mechanic-admin
  namespace: mechanic
  labels:
    app: mechanic-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mechanic-admin
  template:
    metadata:
      labels:
        app: mechanic-admin
    spec:
      containers:
        - name: admin-portal
          image: mechanic-admin-portal:latest
          # Never pull from a registry — use the locally-built image
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
