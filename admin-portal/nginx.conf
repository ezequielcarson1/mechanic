server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA catch-all → index.html ────────────────────────────────
    # The SPA calls the backend API directly using the URL injected
    # at startup into /env.js (window.__ENV__.API_BASE_URL).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
