services:
  # ─── Backend API + WebSocket Server ──────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mechanic-server
    restart: unless-stopped
    ports:
      - "3000:3000"     # Expose directly (useful for the mobile app / dev)
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_PATH=/app/db/mechanic.db
    volumes:
      # Persist the SQLite database outside the container
      - db_data:/app/db
    networks:
      - mechanic-net

  # ─── Admin Portal (Vite/React → nginx) ───────────────────────────
  admin-portal:
    build:
      context: ./admin-portal
      dockerfile: Dockerfile
    container_name: mechanic-admin
    restart: unless-stopped
    ports:
      - "80:80"         # Serve on standard HTTP port
    depends_on:
      - server
    networks:
      - mechanic-net

networks:
  mechanic-net:
    driver: bridge

volumes:
  db_data:
